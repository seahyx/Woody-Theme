; settings.ini — desktop client settings for the fictional woody-inventory service.
; Demonstrates INI syntax: sections, dotted section names, "key = value" and "key: value" pairs, ; and # comments, quoted and unquoted values, numbers, booleans, empty values, paths and %(name)s interpolation.

[DEFAULT]
# Keys here are visible in every section and can be interpolated with %(name)s
base_dir = /opt/woody
data_dir = %(base_dir)s/data
log_level = INFO

[general]
app_name = woody-inventory
version = 2.4.1
site: SITE-NORTH
units: metric
timezone = "Europe/London"
first_run = false

[server]
host = inventory.example.com
port = 8443
use_tls = true
; leave empty to connect without a proxy
proxy =
user_agent = "woody-desktop/2.4.1 (+https://example.com/contact)"

[database]
driver = sqlite
path = %(data_dir)s/inventory.sqlite3
busy_timeout_ms = 5000

[paths]
exports = C:\Woody\Exports
photos = "D:\Survey Photos\2026"
cache = %(base_dir)s/cache

[sensors]
poll_interval: 60
moisture_alert_pct: 19.5
temperature_min_c: -5
enabled = yes

[sensors.moisture]
unit = percent
calibration_offset = -0.4
calibration_gain = 1.02

[sensors.temperature]
unit = celsius
calibration_offset = 0.0
# disabled until the replacement probe arrives
enabled = off

[grading]
grades = A, B, C, reject
min_width_mm = 150
allow_wane = no
; %% is a literal percent sign when interpolation is enabled
moisture_label = Moisture %%
