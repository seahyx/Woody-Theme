name: Marketplace identity

# One-off setup step. Prints the Azure DevOps profile ID of the managed identity that the release job signs in as.
# Add that ID as a Contributor member of the seahyx publisher at https://marketplace.visualstudio.com/manage, then delete this workflow.

on: workflow_dispatch

permissions:
  id-token: write

jobs:
  print-id:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # 499b84ac-... is the fixed resource ID of Azure DevOps, which the Marketplace uses.
      - name: Print profile ID
        run: |
          az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id -o tsv
