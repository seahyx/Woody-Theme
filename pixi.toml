# Development toolchain. package.json is still the extension manifest and holds the build scripts; these tasks just run them with the pinned Node.js.
# No version here: semantic-release bumps the one in package.json.

[workspace]
name = "woody-theme"
authors = ["Seah Ying Xiang <seahyx@gmail.com>"]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64"]
requires-pixi = ">=0.83"

[dependencies]
nodejs = "24.*"
prek = ">=0.5.7,<0.6"

[tasks]
build = { cmd = "npm run build", description = "Regenerate themes/Woody-color-theme.json" }
watch = { cmd = "npm run watch", description = "Regenerate the theme on every save" }
deps = { cmd = "npm ci", inputs = ["package-lock.json"], outputs = ["node_modules/.package-lock.json"], description = "Install the npm devDependencies (vsce, semantic-release)" }
package = { cmd = "npm run package", depends-on = ["deps"], description = "Build the .vsix" }
lint = { cmd = "prek run --all-files", description = "Run every prek hook on all files" }
hooks = { cmd = "prek install", description = "Install the git hooks" }
